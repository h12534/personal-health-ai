name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_ios:
        description: Build a signed IPA (requires ios-beta environment configuration)
        type: boolean
        default: false
      upload_testflight:
        description: Upload signed IPA to App Store Connect (internal testing only)
        type: boolean
        default: false
      ui_golden_review:
        description: Capture exactly 74 standard and 12 free synthetic UI PNGs after fail-closed safety checks
        type: boolean
        default: false
      ui_golden_review_scope:
        description: Review both approved sets, or retry only the missing free set
        type: choice
        options: [both, free]
        default: both

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.signed_ios || vars.IOS_RELEASE_ENABLED == 'true' }}
  cancel-in-progress: ${{ !(inputs.signed_ios || vars.IOS_RELEASE_ENABLED == 'true') }}

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_audit.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: sh -n scripts/backup.sh scripts/restore_test.sh scripts/measure_resources.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --no-incremental app
      - run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: health_os_test
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-that-is-long-enough-12345
      DATABASE_URL: postgresql+asyncpg://health:health-test-password@localhost:5432/health_os_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - name: Verify migration downgrade and re-upgrade chain
        run: |
          alembic downgrade 0006_phase6_health_knowledge
          alembic upgrade 0007_phase7_supervision
          alembic upgrade head
          alembic check
      - run: pytest -q tests_postgres -m integration
      - name: Seed representative restore-drill records
        run: python -m app.scripts.seed_restore_drill
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated PostgreSQL restore drill
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: health
          PGPASSWORD: health-test-password
          SOURCE_DATABASE: health_os_test
          RESTORE_DATABASE: health_os_restore_drill
          RESTORE_REPORT_PATH: artifacts/restore-report.txt
        run: sh scripts/restore_test.sh
      - name: Upload restore drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-restore-report
          path: artifacts/restore-report.txt
          if-no-files-found: error

  mobile-ios-primary:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_BUNDLE_ID: com.personal.healthcoach
      APP_DISPLAY_NAME: 私人健康
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter doctor -v
      - run: xcodebuild -version
      - run: pod --version
      - run: flutter pub get
      - run: dart run tool/configure_ios.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://staging-api.personal-health.invalid/api/v1

  # Explicit owner-authorized review only; never a substitute for full tests.
  # A missing/unreviewed digest FAILS the test step. Safety/upload can run after
  # that failure to collect evidence; neither continue-on-error nor auto-accept.
  ui-golden-review:
    if: >-
      github.repository == 'h12534/personal-health-ai' &&
      github.ref == 'refs/heads/feature/ui-redesign-impeccable' &&
      github.event_name == 'workflow_dispatch' && inputs.ui_golden_review
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.ui_golden_review_scope == 'free' && '["free"]' || '["standard", "free"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Attest reviewed source and synthetic fixture boundary
        id: attest
        run: python scripts/ui_golden_safety.py attest
      - run: flutter pub get
        working-directory: mobile
      - name: Execute all strict Golden cases with selected evidence capture
        id: goldens
        working-directory: mobile
        shell: bash
        env:
          REVIEW_FLAVOR: ${{ matrix.flavor }}
        run: |
          flags=(--dart-define=UI_GOLDEN_REVIEW=true)
          if [[ "$REVIEW_FLAVOR" == "free" ]]; then
            flags+=(--dart-define=APP_DISTRIBUTION=personal_sideload --dart-define=PERSONAL_SIDELOAD_FREE=true)
          fi
          flutter test --no-pub "${flags[@]}" test/ui_redesign_golden_test.dart
      - name: Compile offline Chinese and English OCR safety checker
        id: ocr
        if: always() && steps.attest.outcome == 'success' && steps.goldens.outcome != 'skipped'
        run: swiftc scripts/ui_golden_ocr.swift -o "$RUNNER_TEMP/ui-golden-ocr"
      - name: Fail-closed privacy scan and metadata-free PNG staging
        id: safety
        if: always() && steps.ocr.outcome == 'success'
        env:
          REVIEW_FLAVOR: ${{ matrix.flavor }}
        run: >-
          python scripts/ui_golden_safety.py prepare
          --flavor "$REVIEW_FLAVOR"
          --input "mobile/test/failures/ui-review/$REVIEW_FLAVOR"
          --output "mobile/build/ui-review/$REVIEW_FLAVOR"
          --ocr "$RUNNER_TEMP/ui-golden-ocr"
      - name: Upload only approved synthetic PNGs, one-day retention
        if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-golden-${{ matrix.flavor }}-${{ github.run_id }}
          path: mobile/build/ui-review/${{ matrix.flavor }}/*.png
          if-no-files-found: error
          retention-days: 1

  mobile-android-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.personal .
      - run: dart run tool/configure_platforms.dart
      - run: flutter build apk --debug

  # Personal unsigned artifacts need no Apple account, Secrets, or local Mac.
  mobile-ios-personal-sideload:
    needs: [release-audit, backend, backend-postgres, mobile-ios-primary]
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_BUNDLE_ID: ${{ vars.PERSONAL_IOS_BUNDLE_ID || 'com.personal.healthcoach' }}
      APP_DISPLAY_NAME: 私人健康
      APP_DISTRIBUTION: personal_sideload
      API_BASE_URL: ${{ vars.PERSONAL_IOS_API_BASE_URL || 'https://staging-api.personal-health.invalid/api/v1' }}
      APP_VERSION: '0.1.0'
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Record unsigned build toolchain
        run: |
          flutter doctor -v
          xcodebuild -version
          pod --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Test HealthKit-attempt personal mode
        run: flutter test --dart-define=APP_DISTRIBUTION=personal_sideload
      - name: Build HealthKit-attempt app (no signing)
        run: python ../scripts/personal_sideload.py build --variant healthkit
      - name: Package and verify HealthKit-attempt unsigned IPA
        run: python ../scripts/personal_sideload.py package --variant healthkit
      - name: Upload personal unsigned IPA and evidence
        uses: actions/upload-artifact@v4
        with:
          name: personal-health-ios-unsigned
          path: mobile/build/personal-sideload/healthkit/*
          if-no-files-found: error
          retention-days: 7
      - name: Test PERSONAL_SIDELOAD_FREE manual fallback
        run: >-
          flutter test --dart-define=APP_DISTRIBUTION=personal_sideload
          --dart-define=PERSONAL_SIDELOAD_FREE=true
      - name: Build manual fallback app (no signing)
        run: python ../scripts/personal_sideload.py build --variant free
      - name: Package and verify manual fallback unsigned IPA
        run: python ../scripts/personal_sideload.py package --variant free
      - name: Upload free fallback unsigned IPA and evidence
        uses: actions/upload-artifact@v4
        with:
          name: personal-health-ios-free-unsigned
          path: mobile/build/personal-sideload/free/*
          if-no-files-found: error
          retention-days: 7

  # Future paid route retained but suspended for the current personal release.
  # Separate from the already closed compilation gate. No secrets on PRs/forks.
  # Owner opts in only after configuring and protecting the ios-beta environment.
  mobile-ios-signed:
    needs: [release-audit, backend, backend-postgres, mobile-ios-primary]
    if: >-
      github.repository == 'h12534/personal-health-ai' &&
      vars.APP_DISTRIBUTION == 'app_store' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/release-candidate-beta') &&
      ((github.event_name == 'workflow_dispatch' && inputs.signed_ios) ||
       (github.event_name == 'push' && vars.IOS_RELEASE_ENABLED == 'true'))
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-beta
    concurrency:
      group: ios-beta-signing
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      API_BASE_URL: ${{ vars.IOS_BETA_API_BASE_URL }}
      APP_ENV: staging
      IOS_SIGNING_MODE: ${{ vars.IOS_SIGNING_MODE || 'automatic' }}
      APP_STORE_CONNECT_DISABLE_JWT_CACHE: 'true'
      APP_VERSION: '0.1.0'
      # Unique across workflow reruns; native and diagnostic build numbers match.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate owner configuration (no fallback placeholders)
        run: python ../scripts/ios_release.py preflight
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Record cloud toolchain
        run: |
          flutter doctor -v
          xcodebuild -version
          pod --version
      - run: python -m pip install codemagic-cli-tools==0.69.0
      - run: flutter pub get
      - run: dart run tool/configure_ios.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Import signing identity and validate HealthKit profile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python ../scripts/ios_release.py sign
      - name: Archive and export signed IPA
        run: python ../scripts/ios_release.py build
      - name: Verify signed IPA and write non-secret evidence
        id: verify-ipa
        run: python ../scripts/ios_release.py verify
      - name: Upload to App Store Connect (not external beta or App Store review)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) ||
          (github.event_name == 'push' && vars.IOS_TESTFLIGHT_UPLOAD == 'true')
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python ../scripts/ios_release.py upload
      - name: Save signed IPA (never certificates or standalone profiles)
        if: always() && steps.verify-ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-beta-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/ipa/release-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: python ../scripts/ios_release.py cleanup

