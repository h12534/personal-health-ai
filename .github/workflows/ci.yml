name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_audit.py
      - run: sh -n scripts/backup.sh scripts/restore_test.sh scripts/measure_resources.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --no-incremental app
      - run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: health_os_test
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-that-is-long-enough-12345
      DATABASE_URL: postgresql+asyncpg://health:health-test-password@localhost:5432/health_os_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - name: Verify migration downgrade and re-upgrade chain
        run: |
          alembic downgrade 0006_phase6_health_knowledge
          alembic upgrade 0007_phase7_supervision
          alembic upgrade head
          alembic check
      - run: pytest -q tests_postgres -m integration
      - name: Seed representative restore-drill records
        run: python -m app.scripts.seed_restore_drill
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated PostgreSQL restore drill
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: health
          PGPASSWORD: health-test-password
          SOURCE_DATABASE: health_os_test
          RESTORE_DATABASE: health_os_restore_drill
          RESTORE_REPORT_PATH: artifacts/restore-report.txt
        run: sh scripts/restore_test.sh
      - name: Upload restore drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-restore-report
          path: artifacts/restore-report.txt
          if-no-files-found: error

  mobile-ios-primary:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_BUNDLE_ID: com.personal.healthcoach
      APP_DISPLAY_NAME: 私人健康
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter doctor -v
      - run: xcodebuild -version
      - run: pod --version
      - run: flutter pub get
      - run: dart run tool/configure_ios.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://staging-api.personal-health.invalid/api/v1

  mobile-android-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.personal .
      - run: dart run tool/configure_platforms.dart
      - run: flutter build apk --debug

