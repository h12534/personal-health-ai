[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-health-os-api"
version = "0.1.0"
description = "Private, safety-first Personal Health OS backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pillow>=11.1,<12",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "PyMuPDF>=1.25,<2",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require PostgreSQL and Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "B008",  # FastAPI intentionally uses Depends/Query calls in parameter defaults.
  "UP046", # Pydantic generics retain the cross-tooling-compatible Generic form.
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_redundant_casts = false
exclude = ["alembic"]

