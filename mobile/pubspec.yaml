name: personal_health_os
description: Private AI health, nutrition, and training coach.
publish_to: none
version: 0.1.0-beta.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  drift: ^2.35.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  health: 13.3.1
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  timezone: ^0.11.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

